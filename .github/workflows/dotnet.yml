name: .NET WinForms Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore "HeThongDangKyThamGiaCLBNhom9TT26/HeThongDangKyThamGiaCLBNhom9TT26.sln"

      - name: Build
        run: dotnet build "HeThongDangKyThamGiaCLBNhom9TT26/HeThongDangKyThamGiaCLBNhom9TT26.sln" --no-restore --configuration Release
